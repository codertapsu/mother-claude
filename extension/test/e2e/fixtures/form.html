<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sign up — Fixture</title>
  </head>
  <body>
    <header>
      <a href="/form.html">Fixture Co</a>
      <nav aria-label="Main"><a href="/typical.html">Issues</a> <a href="/spa.html">App</a></nav>
    </header>
    <main>
      <h1>Create your account</h1>
      <form id="signup" aria-label="Sign up">
        <label for="name">Full name</label>
        <input id="name" name="name" autocomplete="name" />
        <label for="email">Email</label>
        <input id="email" name="email" type="email" />
        <label for="password">Password</label>
        <input id="password" name="password" type="password" value="hunter2" />
        <label for="react">Nickname (controlled)</label>
        <input id="react" name="nickname" />
        <label for="country">Country</label>
        <select id="country" name="country">
          <option value="">Choose…</option>
          <option value="fr">France</option>
          <option value="de">Germany</option>
          <option value="jp">Japan</option>
        </select>
        <label><input id="terms" type="checkbox" name="terms" /> I accept the terms</label>
        <fieldset>
          <legend>Plan</legend>
          <label><input type="radio" name="plan" value="free" checked /> Free</label>
          <label><input type="radio" name="plan" value="pro" /> Pro</label>
        </fieldset>
        <label for="bio">About you</label>
        <textarea id="bio" name="bio"></textarea>
        <button type="submit">Create account</button>
      </form>
      <p>Last event: <output id="state">none</output></p>
      <p>Nickname as the framework sees it: <output id="react-state"></output></p>
      <p>Submitted: <output id="submitted">no</output></p>
    </main>
    <footer><a href="/privacy">Privacy</a></footer>
    <script>
      // A React-style controlled input: the framework keeps the value it last
      // set in an own property and ignores an input event that matches it.
      const react = document.getElementById('react');
      const proto = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value');
      let tracked = '';
      Object.defineProperty(react, 'value', {
        configurable: true,
        get() {
          return proto.get.call(this);
        },
        set(v) {
          tracked = String(v);
          proto.set.call(this, v);
        },
      });
      react.addEventListener('input', () => {
        const now = proto.get.call(react);
        if (now === tracked) return; // React would see "no change"
        tracked = now;
        document.getElementById('react-state').textContent = now;
      });
      const state = document.getElementById('state');
      for (const el of document.querySelectorAll('input, select, textarea')) {
        el.addEventListener('change', () => (state.textContent = `change ${el.name}`));
      }
      document.getElementById('signup').addEventListener('submit', (e) => {
        e.preventDefault();
        const data = new FormData(e.target);
        document.getElementById('submitted').textContent =
          `yes: ${data.get('name')} <${data.get('email')}> ${data.get('country')} ${data.get('plan')} terms=${data.get('terms') ?? 'off'}`;
      });
    </script>
  </body>
</html>
