[package]
name = "mother-claude"
version = "0.11.0"
description = "Monitor and control every local Claude Code session from one dashboard."
authors = ["Mother Claude"]
edition = "2021"
rust-version = "1.95"

[lib]
# The Tauri app lives in a lib so it can be shared with mobile targets and tests.
name = "mother_claude_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
# `tray-icon`: Tauri's own tray, for *Start Mother Claude when you sign in,
# in the tray* (`autostart`); the `tray-icon` crate it builds is already in
# Cargo.lock (Tauri's optional dependency), so nothing new is downloaded.
tauri = { version = "2.12.5", features = ["tray-icon"] }
# In-app auto-updater (desktop-only; registered behind cfg(desktop) in lib.rs)
# and process control for relaunching into the new version after an update.
# Use native-tls (OS trust store) for the updater's downloads so its reqwest does
# not pull rustls-no-provider into the graph — that would otherwise unify onto our
# server/test reqwest and panic for want of a process-default rustls CryptoProvider
# (our server uses its own rustls+ring stack independently).
tauri-plugin-updater = { version = "2.14.1", default-features = false, features = ["native-tls", "zip"] }
tauri-plugin-process = "2.4.0"
# One Mother Claude at a time (registered first in lib.rs): a second copy
# would race the first for its ports (6725, 6726, 5612), its data files
# (machines.json, the index checkpoints, the per-launch mcp.token) and its
# Machines endpoint (the same machine key), and its window would be a dead
# one. Tauri's own plugin: a named mutex and WM_COPYDATA on Windows, a Unix
# socket on macOS, D-Bus on Linux; a second launch hands its arguments to
# the first and exits. Its Windows dependency (windows-sys 0.61) is already
# in Cargo.lock; zbus is Linux-only.
tauri-plugin-single-instance = "2.5.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
anyhow = "1.0.104"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
notify = "8.2.2"
notify-debouncer-full = "0.7.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
git2 = { version = "0.21.0", default-features = false }
axum = { version = "0.8.9", features = ["ws", "multipart"] }
axum-server = { version = "0.9.0", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rcgen = "0.14.10"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["cors", "trace", "fs", "compression-gzip", "compression-br"] }
# The HTTP bridge: SSE streams (futures-util) and the direct Messages API
# path (reqwest). reqwest must use native-tls here for the same reason the
# updater does — a rustls-no-provider reqwest would unify with our own
# rustls+ring server stack and panic for want of a process-default provider.
futures-util = { version = "0.3.34", default-features = false, features = ["std", "sink"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls", "multipart", "stream"] }
uuid = { version = "1.29.2", features = ["v4"] }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
directories = "6.0.0"
sha2 = "0.11.1"
# Authenticates a backup set's index (HMAC-SHA256, keyed from the set's key);
# already in the dependency graph, the version that matches sha2 0.11.
hmac = "0.13.0"
# Random credentials (device / hook / sidecar tokens, pairing codes) and their
# base64url encoding. Both are already in the dependency graph.
getrandom = "0.4.3"
base64 = "0.23.1"
# Process liveness checks for the live session roster (`kill(pid, 0)`).
libc = "0.2.191"
# Web Push (VAPID + RFC 8291 payload encryption), pure Rust; delivery goes
# through our own reqwest client.
web-push-native = "0.5.0"
portable-pty = { version = "0.9.0", optional = true }
# Backups of each account's data (docs/ACCOUNTS.md D6): tar + gzip archives
# encrypted with age, so every archive opens with standard tools.
age = { version = "0.12.1", default-features = false }
tar = { version = "0.4.46", default-features = false }
flate2 = "1.1.11"
# `canonicalize` without Windows' `\\?\` verbatim prefix wherever a plain
# path names the same folder (`claude::paths`). Already in the dependency
# graph through Tauri.
dunce = "1.0.5"
# Host metrics for admission control (orchestration::host): free memory, load
# and each live session's resident memory, on macOS and Windows alike. Only
# the `system` feature.
sysinfo = { version = "0.40.1", default-features = false, features = ["system"] }
# The browser extension (`extension`): origins of the pages it acts on (IDN,
# IPv6, default ports) and the server-side redaction of what it reads. Both
# are already in the dependency graph.
url = "2.5.8"
regex = "1.13.1"
# Machines (docs/PLAN-MACHINES.md): this user's computers, paired by key and
# joined by QUIC — direct on the LAN, hole-punched or relayed across networks
# (iroh, D7) — with the app's own axum router served per stream (hyper).
iroh = "1.4.1"
iroh-mdns-address-lookup = "0.6.1"
hyper = { version = "1.12.0", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1.21", features = ["tokio", "service"] }
http-body-util = "0.1.3"
# A machine's WebSocket client to another's `/ws` over the peer link (the
# federation). The version axum already builds.
# Renamed: the tests use tokio-tungstenite 0.30 under its own name.
ws-client = { package = "tokio-tungstenite", version = "0.29.0" }

# The accounts feature keeps token accounts' tokens and the backup passphrase
# in the login Keychain (docs/ACCOUNTS.md D3). Already in the tree through
# native-tls.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"

# Whether a pidfile's process still runs on Windows (`live::pid_exists`), as
# `kill(pid, 0)` tells elsewhere, Windows Credential Manager for the
# accounts' secrets (`secrets::CredentialStore`), and a job object holding
# each run another computer asked for, so a cancel or a timeout ends its
# whole process tree (`machines::work::shell`), and the per-user `Run` key
# that starts Mother Claude at sign-in (`autostart`). Already in the
# dependency graph.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Power", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_WindowsProgramming"] }

[dev-dependencies]
tempfile = "3.27.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
tokio-tungstenite = "0.30.0"
futures-util = "0.3.34"

# The memory figures of the measurement tests (tests/measure.rs) on Windows.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_ProcessStatus", "Win32_System_Threading"] }

[features]
# Foreign-session injection via PTY-driving `claude attach` (Stage 3). Uses
# unsanctioned, unstable internals but is ON by default so the dashboard can
# drive foreign sessions. Build with `--no-default-features` to compile it out;
# disable at runtime with MOTHER_CLAUDE_FOREIGN_INJECTION=0.
default = ["experimental", "token-capture"]
experimental = ["dep:portable-pty"]
# Run `claude setup-token` in a pseudo-terminal and take the token it shows
# (docs/ACCOUNTS.md D3). Without it a token account's token can only be pasted.
token-capture = ["dep:portable-pty"]

# Dependencies optimized in `tauri dev` and `cargo test` too: backups gzip,
# encrypt and hash every byte (age, flate2, sha2), which unoptimized run about
# ten times slower — minutes for one large conversation. Our own crate stays
# unoptimized, so it still builds fast and debugs well.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
